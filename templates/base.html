<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlyxPanel - Minecraft</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header class="top"><div class="logo">⛏️ Slyx<span>Panel</span> <span style="font-size:12px;color:#94a3b8">MINECRAFT</span></div><nav class="nav"><a href="/" class="{% if request.path=='/' %}active{% endif %}">Dashboard</a><a href="/console" class="{% if 'console' in request.path %}active{% endif %}">Console</a><a href="/worlds" class="{% if 'world' in request.path %}active{% endif %}">Worlds & Backups</a><a href="/players" class="{% if 'players' in request.path %}active{% endif %}">Players</a><a href="/files" class="{% if 'files' in request.path %}active{% endif %}">Files</a><a href="/settings" class="{% if 'settings' in request.path %}active{% endif %}">Settings</a><a href="/logout">Logout</a></nav></header>
<div class="wrap">{% with m=get_flashed_messages() %}{% if m %}{% for x in m %}<div class="flash">✓ {{x}}</div>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</div>
<script>async function refreshStats(){try{let r=await fetch('/api/stats');let d=await r.json();let el=document.getElementById('cpu');if(el)el.textContent=d.cpu+'%';let e2=document.getElementById('ram');if(e2)e2.textContent=d.ram_used+' / '+d.ram_total+' MB';let e3=document.getElementById('online');if(e3)e3.textContent=d.player_count;}catch(e){}} setInterval(refreshStats,4000);</script></body></html>
