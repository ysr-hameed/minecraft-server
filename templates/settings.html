{% extends "base.html" %}{% block content %}
<h1>Settings & Version ⚙️</h1>
<form method="POST"><div class="card" style="margin-top:12px"><h3>Version & Type</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label class="sub">Server Type</label><select class="select" name="server_type"><option value="java" {% if server_type=='java' %}selected{% endif %}>Java (Paper - PC)</option><option value="bedrock" {% if server_type=='bedrock' %}selected{% endif %}>Bedrock (Mobile)</option></select></div><div><label class="sub">Minecraft Version</label><select class="select" name="version"><option>1.21.1</option><option>1.21</option><option>1.20.4</option><option>1.20.1</option><option>1.19.4</option></select><p class="sub">Current: {{version}}</p></div></div></div>
<div class="card" style="margin-top:14px"><h3>server.properties — Edit Any Setting</h3>{% for k,v in props.items() %}<div style="display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center"><label style="font-size:13px">{{k}}</label><input class="input" name="{{k}}" value="{{v}}" style="margin:2px 0"></div>{% endfor %}<button class="btn btn-green" style="margin-top:14px">Save All Settings</button><p class="sub">Restart server to apply.</p></div></form>
{% endblock %}
