{% extends "base.html" %}{% block content %}<h1>Backups</h1><p class="sub">All backups listed with date & number</p>{% for b in backups %}<div class="card" style="margin-top:10px;display:flex;justify-content:space-between"><span><b>{{b.name}}</b><br><span class="sub">{{b.date}} • {{b.size_mb}} MB</span></span><a href="/backup/download/{{b.name}}" class="btn btn-ghost">Download</a></div>{% endfor %}{% endblock %}
